<!DOCTYPE html>
<html>
<head>
  <title>绳墨脚本编辑器</title>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta charset="utf-8"/>
  <style>
   :root {
       --message-user-bg-color: #FFF2E2;
       --message-user-text-color: #000;
       --border-radius-large: 15px;
       --padding-large: 10px;
   }
   body{font-family:sans-serif;background-color:#121212;color:#c0c0c0;margin:0;padding:0;display:flex;height:100vh;overflow:hidden;}
   #left-pane{flex-grow:1;display:flex;flex-direction:column;overflow:hidden;background-color:#1e1e1e;}
   #editor-container{flex-grow:1;overflow:hidden;}
   #right-pane{width:280px;flex-shrink:0;background-color:#1e1e1e;border-left:1px solid #333;display:flex;flex-direction:column;overflow:hidden;}
   #controls-area-wrapper{height:auto;flex-shrink:0;overflow-y:auto;padding:5px;border-bottom:1px solid #333;}
   #controls-area{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:flex-start;}
   #debug-area-wrapper{flex-grow:1;padding:5px;display:flex;flex-direction:column;min-height:0;}
   #debug-output{flex-grow:1;background-color:#181818;border:1px solid #2a2a2a;border-radius:3px;padding:8px;font-family:monospace;font-size:0.85em;white-space:pre-wrap;overflow:auto;color:#aaa;min-height:0;word-break:break-all;}
   #debug-output div{margin-bottom:3px;padding-bottom:2px;border-bottom:1px dotted #2a2a2a;}
   #debug-output div:last-child{border-bottom:none;}
   .std-button{color:#e0c2a3;background-color:#3a3a3a;border:1px solid #e0c2a3;padding:8px 12px;border-radius:4px;text-align:center;cursor:pointer;font-size:0.9em;white-space:nowrap;transition:background-color 0.2s;flex-grow:1;min-width:auto;}
   .std-button:hover{background-color:#4a4a4a;}
   .std-button:disabled{background-color:#2a2a2a;color:#555;border-color:#444;cursor:not-allowed;}
   .modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,0.7);justify-content:center;align-items:center;}
   .modal.active{display:flex;}
   .modal-content{background-color:#1e1e1e;padding:20px;border:1px solid #333;border-radius:5px;width:90%;max-width:800px;display:flex;flex-direction:column;max-height:90vh;}
   .modal-content h2{margin-top:0;color:#e0c2a3;border-bottom:1px solid #333;padding-bottom:10px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center;}
   .file-tree-search-controls{display:flex;margin-bottom:10px;}
   #file-tree-search-input{flex-grow:1;padding:6px;background-color:#333;border:1px solid #555;color:#ccc;border-radius:3px;font-size:0.9em;margin-right:5px;}
   #file-tree-search-button{padding:6px 10px;font-size:0.9em;min-width:auto;color:#e0c2a3;background-color:#3a3a3a;border:1px solid #e0c2a3;border-radius:3px;cursor:pointer;}
   .modal-content textarea{width:100%;min-height:200px;max-height:40vh;background-color:#121212;color:#c0c0c0;border:1px solid #333;border-radius:3px;padding:10px;box-sizing:border-box;font-family:monospace;font-size:0.9em;margin-bottom:15px;resize:vertical;}
   .modal-buttons{display:flex;justify-content:flex-end;gap:10px;margin-top:15px;flex-wrap:wrap;}
   #file-tree-container{flex-grow:1;overflow-y:auto;border:1px solid #333;padding:10px;background-color:#121212;min-height:300px;max-height:60vh;}
   .file-tree ul{list-style-type:none;padding-left:15px;margin:0;}
   .file-tree li{padding:3px 0;}
   .file-tree-item{cursor:pointer;display:flex;align-items:center;padding:2px;border-radius:2px;}
   .file-tree-item:hover{background-color:#2a2a2a;}
   .file-tree-item.active-file-in-tree{background-color:#007acc;color:white;}
   .file-tree-item.search-highlight{background-color:#f39c12;color:#121212;}
   .folder-name::before{content:'📁 ';margin-right:5px;}
   .file-name::before{content:'📄 ';margin-right:5px;}
   .file-tree-item input[type="checkbox"]{margin-right:8px;}
   #current-file-display-wrapper{display:flex;align-items:center;padding:8px 5px;background-color:#252526;border-bottom:1px solid #333;flex-shrink:0;}
   #current-file-name-span{flex-grow:1;font-weight:bold;color:#9cdcfe;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px;}
   #editor-search-input{padding:4px;background-color:#333;border:1px solid #555;color:#ccc;border-radius:3px;font-size:0.9em;flex-shrink:1;min-width:100px;max-width:200px;}
   #editor-search-button{margin-left:5px;padding:4px 6px;font-size:0.9em;min-width:auto;color:#e0c2a3;background-color:#3a3a3a;border:1px solid #e0c2a3;border-radius:3px;width:auto;height:auto;}
   .log-error{color:#F44336;}
   .log-success{color:#4CAF50;}
   .log-warn{color:#FFC107;}
   .log-info{color:#2196F3;}

   #ai-chat-pane { background-color: #1e1e1e; border-left: 1px solid #333; }
   
   .ai-message-bubble {
       padding: var(--padding-large);
       margin-bottom: 10px;
       border-radius: var(--border-radius-large);
       max-width: 85%;
       word-wrap: break-word;
       white-space: pre-wrap;
       position: relative;
       cursor: pointer;
       background-color: var(--message-user-bg-color);
       color: var(--message-user-text-color);
       text-align: left;
   }

   .ai-message-bubble.user {
       align-self: flex-end;
   }

   .ai-message-bubble.ai {
       align-self: flex-start;
   }
   
   .ai-message-bubble.editing {
       box-shadow: 0 0 5px rgba(224, 194, 163, 0.7);
       outline: none;
       cursor: text;
       width: 85%;
   }

   .ai-message-actions { display: none; position: absolute; top: -15px; right: 5px; background: #1e1e1e; border: 1px solid #555; border-radius: 3px; padding: 2px; z-index: 10; }
   .ai-message-actions button { background: transparent; border: none; color: #c0c0c0; cursor: pointer; font-size: 0.8em; }
   .ai-message-actions button:hover { color: #e0c2a3; }
   .ai-message-bubble:hover .ai-message-actions { display: flex; gap: 5px; }

   .ai-message-edit-textarea {
       width: 100%;
       background-color: transparent;
       color: inherit;
       border: none;
       padding: 0;
       font-family: inherit;
       font-size: inherit;
       resize: none;
       box-sizing: border-box;
       outline: none;
       overflow: hidden;
       display: block;
       line-height: inherit;
   }

   .file-block-wrapper {
       border: 1px solid #444;
       border-radius: 4px;
       margin: 5px 0;
       background-color: #1e1e1e;
       overflow: hidden;
       display: flex;
       flex-direction: column;
       color: #c0c0c0;
       text-align: left;
   }
   .file-block-header {
       background-color: #2d2d2d;
       color: #e0c2a3;
       padding: 6px 10px;
       font-size: 0.9em;
       font-weight: bold;
       cursor: pointer;
       user-select: none;
       display: flex;
       justify-content: space-between;
       align-items: center;
       word-break: break-all;
   }
   .file-block-header:hover {
       background-color: #383838;
   }
   .file-block-header::after {
       content: '▶';
       font-size: 0.8em;
       transition: transform 0.2s;
       margin-left: 10px;
   }
   .file-block-content {
       display: none;
       padding: 10px;
       overflow-x: auto;
       font-family: 'Consolas', 'Courier New', monospace;
       font-size: 0.9em;
       color: #d4d4d4;
       border-top: 1px solid #444;
   }
   .file-block-wrapper.expanded .file-block-content {
       display: block;
   }
   .file-block-wrapper.expanded .file-block-header::after {
       transform: rotate(90deg);
   }

   .ai-input-container {
       padding: 10px;
       border-bottom: 1px solid #333;
       display: flex;
       gap: 10px;
       align-items: flex-end;
       position: relative;
   }
   .ai-input-textarea {
       flex-grow: 1;
       background-color: #121212;
       color: #c0c0c0;
       border: 1px solid #555;
       border-radius: 4px;
       padding: 5px;
       box-sizing: border-box;
       font-family: inherit;
       height: 36px;
       resize: none;
       overflow-y: hidden;
       line-height: 24px;
   }
   .ai-send-button {
       width: auto;
       padding: 0 15px;
       height: 36px;
       display: flex;
       align-items: center;
       justify-content: center;
       flex-shrink: 0;
       flex: 0 0 auto;
   }
   .ai-quick-button {
       width: 36px;
       height: 36px;
       padding: 0;
       display: flex;
       align-items: center;
       justify-content: center;
       flex-shrink: 0;
       flex: 0 0 auto;
       font-size: 1.2em;
   }
   .ai-quick-menu {
       display: none;
       position: absolute;
       top: 50px;
       right: 10px;
       background-color: #252526;
       border: 1px solid #454545;
       border-radius: 4px;
       width: 300px;
       z-index: 100;
       box-shadow: 0 4px 6px rgba(0,0,0,0.3);
   }
   .ai-quick-menu.active {
       display: block;
   }
   .ai-settings-menu {
       display: none;
       position: absolute;
       top: 50px;
       left: 10px;
       background-color: #252526;
       border: 1px solid #454545;
       border-radius: 4px;
       width: 180px;
       z-index: 100;
       box-shadow: 0 4px 6px rgba(0,0,0,0.3);
   }
   .ai-settings-menu.active {
       display: block;
   }
   .ai-quick-item, .ai-settings-item {
       padding: 10px 12px;
       cursor: pointer;
       color: #ccc;
       border-bottom: 1px solid #333;
       font-size: 0.9em;
       line-height: 1.4;
   }
   .ai-quick-item:last-child, .ai-settings-item:last-child {
       border-bottom: none;
   }
   .ai-quick-item:hover, .ai-settings-item:hover {
       background-color: #3a3a3a;
       color: #e0c2a3;
   }
   .ai-settings-item.active {
       color: #e0c2a3;
       font-weight: bold;
   }
   .ai-settings-section-header {
       padding: 8px 12px 4px 12px;
       font-size: 0.75em;
       color: #888;
       text-transform: uppercase;
       letter-spacing: 1px;
   }

   @media (max-width: 768px) {
       body { flex-direction: column; }
       #right-pane {
           width: 100%;
           height: auto;
           max-height: 50vh;
           border-left: none;
           border-bottom: 1px solid #333;
           order: -1;
           display: grid;
           grid-template-columns: auto 1fr;
           grid-template-rows: 1fr auto;
       }
       #left-pane { width: 100%; flex-grow: 1; order: 1; }
       
       #controls-area-wrapper {
           grid-column: 1 / 2;
           grid-row: 1 / 3;
           border-bottom: none;
           border-right: 1px solid #333;
           overflow-y: auto;
       }
       
       #controls-area {
           grid-template-columns: 1fr 1fr;
       }
       
       #debug-area-wrapper {
           grid-column: 2 / 3;
           grid-row: 1 / 2;
           border-bottom: none;
           overflow-y: auto;
           min-width: 0;
           height: 0;
           min-height: 100%;
       }

       #paste-import-area-wrapper {
           grid-column: 2 / 3;
           grid-row: 2 / 3;
           border-top: 1px solid #333;
           border-bottom: none;
       }

       #ai-chat-pane { border-left: none; }
       
       .std-button { padding: 8px 4px; }
   }
  </style>
  <link data-name="vs/editor/editor.main" href="/vendor/monaco-editor/vs/editor/editor.main.css" rel="stylesheet"/>
</head>
<body>
  {% block content %}{% endblock %}

  <script src="/vendor/monaco-editor/vs/loader.js"></script>
  <script src="/js/editor/editor_main.js"></script>
  <script src="/js/editor/editor_file_ops.js"></script>
  <script src="/js/editor/editor_import_export.js"></script>
  <script src="/js/editor/editor_search.js"></script>
  <script src="/js/editor/editor_actions.js"></script>
  <script src="/js/editor/editor_ai.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        editorMainModule.init();
        editorActionsModule.init();
    });
  </script>
</body>
</html>
